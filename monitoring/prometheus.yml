global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: outbox-relay
    static_configs:
      - targets: ["outbox-relay:8002"]
  - job_name: consumers
    static_configs:
      - targets: ["consumers:8001"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
