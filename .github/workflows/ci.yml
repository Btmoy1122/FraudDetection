name: CI

on:
  push:
    branches: [main, hardening]
  pull_request:
  workflow_dispatch:
    inputs:
      rate:
        description: "Load test rate (tx/s)"
        default: "200"
      duration:
        description: "Load test duration"
        default: "60s"
      api_workers:
        description: "uvicorn workers for the API"
        default: "4"

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: API unit tests
        run: pytest api/tests
      - name: Consumer unit tests
        run: pytest consumers/tests

  integration:
    needs: lint-and-unit
    runs-on: ubuntu-24.04
    env:
      API_WORKERS: ${{ inputs.api_workers || '4' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health; then echo; break; fi
            sleep 3
          done
          curl -sf http://localhost:8000/health
          docker compose ps

      - name: Integration tests
        env:
          INTEGRATION: "1"
        run: pytest tests/integration/test_pipeline.py -v

      - name: Failure-mode tests (stop Redis / Kafka)
        env:
          INTEGRATION: "1"
        run: pytest tests/integration/test_degradation.py -v

      - uses: grafana/setup-k6-action@v1

      - name: Load test
        run: |
          mkdir -p loadtest/results
          # k6 exits 99 when a threshold fails; still publish the summary
          # (a failed run at a high rate is how the ceiling is found).
          status=0
          k6 run \
            -e RATE=${{ inputs.rate || '100' }} \
            -e DURATION=${{ inputs.duration || '30s' }} \
            -e P99_MS=1000 \
            -e API_WORKERS="$API_WORKERS" \
            loadtest/k6.js || status=$?
          cat loadtest/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-results
          path: loadtest/results/
          if-no-files-found: ignore

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
